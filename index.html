<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>InvoGen</title>
  <meta name="description" content="Create invoices, estimates and receipts. Works offline; everything stays on your device.">
  <meta name="theme-color" content="#f5f5f5">
  <meta name="color-scheme" content="light">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="InvoGen">
  <link rel="preload" href="fonts/Inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/SpaceGrotesk-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/print.css" media="print">
  <style id="pageSizeCSS">@page{size:A4;margin:0}</style>
  <!-- Start fetching the app's core modules and English text right away (in parallel). -->
  <link rel="modulepreload" href="js/main.js">
  <link rel="modulepreload" href="js/dom.js">
  <link rel="modulepreload" href="js/state.js">
  <link rel="modulepreload" href="js/storage.js">
  <link rel="modulepreload" href="js/format.js">
  <link rel="modulepreload" href="js/calc.js">
  <link rel="modulepreload" href="js/currencies.js">
  <link rel="modulepreload" href="js/migrate.js">
  <link rel="modulepreload" href="js/i18n.js">
  <link rel="modulepreload" href="js/layout.js">
  <link rel="modulepreload" href="js/icons.js">
  <link rel="modulepreload" href="js/docLabels.js">
  <link rel="modulepreload" href="js/sheet.js">
  <link rel="modulepreload" href="js/toast.js">
  <link rel="modulepreload" href="js/install.js">
  <link rel="preload" href="i18n/en.json" as="fetch" crossorigin>
</head>
<body class="booting">
  <a class="skip-link" id="skipLink" href="#main">Skip to content</a>
  <div class="app">
    <nav class="rail" id="rail" aria-label="Main"></nav>
    <main class="main" id="main" tabindex="-1">
      <div class="boot" aria-busy="true">InvoGen</div>
    </main>
    <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
  </div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <div id="printHost" aria-hidden="true"></div>
  <noscript><p style="padding:24px">InvoGen needs JavaScript to run. Please turn it on and reload.</p></noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
